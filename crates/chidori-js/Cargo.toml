[package]
name = "chidori-js"
version = "0.4.0"
edition = "2021"
# oxc relies on `if let` guards, stabilized in Rust 1.95.
rust-version = "1.95"
license = "Apache-2.0"
description = "Pure-Rust JavaScript engine with deterministic-replay durable execution. No C, no boa_engine."
repository = "https://github.com/ThousandBirdsInc/chidori"

[lib]
name = "chidori_js"
path = "src/lib.rs"

[features]
# Phase-0 dynamic opcode-frequency instrumentation. OFF by default: when off,
# the `opstats` module and its single `record(..)` call site in the interpreter
# loop are `#[cfg]`-removed, so the shipping engine is byte-identical and pays
# nothing. Enable for analysis only: `cargo run --example opstats --features
# op-histogram`. See docs/interpreter-optimization.md (Phase 0).
op-histogram = []
# Opt-in mimalloc global allocator for the `run` example binary — an
# allocator EXPERIMENT knob, not a recommendation. OFF by default, twice
# over: (a) it's a C library (vendored and built by libmimalloc-sys), and the
# crate otherwise builds no C; (b) it measured net-negative here (2026-07).
# Callgrind showed glibc malloc at ~23% of instructions on json_roundtrip/
# string_build and mimalloc cut total instructions 10-13% there — but
# interleaved wall-clock across the whole workload suite ran ~9% slower
# geomean (glibc's tcache beats it on the interpreter's LIFO same-size
# churn, and the instruction-count proxy misses that). Kept so the
# experiment is one flag away on other hardware/allocator versions. Library
# consumers are unaffected either way: a global allocator only takes effect
# in a final binary, and this one is only installed in `examples/run.rs`.
mimalloc = ["dep:mimalloc"]
# EXPERIMENTAL Cranelift baseline JIT for the typed kernel tier (`src/jit.rs`,
# docs/cranelift-jit.md). OFF by default, deliberately: enabling it drops the
# crate-level `forbid(unsafe_code)` to `deny(unsafe_code)` (the native-code
# call boundary in `jit.rs` needs two audited `unsafe` blocks) and pulls in a
# full compiler backend. The default build stays byte-identical, zero-unsafe,
# and cranelift-free — the sandbox-model claim (docs/sandbox-model.md) is
# unchanged unless you opt in. Even when compiled in, the tier only runs when
# the embedder sets `Vm::jit_enabled`; the `chidori-js-jit` binary below is
# the entry point that does. See docs/js-performance-roadmap.md §4 for why
# this is an experiment, not a default.
jit = [
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-frontend",
    "dep:cranelift-codegen",
    "dep:cranelift-native",
]

[dependencies]
# Front end only: we consume the oxc AST and write no lexer/parser of our own.
oxc = { version = "0.138", features = ["semantic", "transformer", "codegen"] }
# Span→line/column resolution for parse-error rendering (oxc diagnostics carry
# miette labeled spans; `SourceCode::read_span` turns a byte offset into a
# position). Core only — no report-rendering features. Already in the tree
# transitively, so this adds no new crates.
miette = { version = "7", default-features = false }
# Deterministic, insertion-ordered property maps. Object/Map/Set iteration order
# must be address-independent for replay to be correct (see determinism contract).
indexmap = "2"
# Journal serialization + the host-effect value boundary (serde_json::Value) that
# matches the existing SnapshotCapableJsEngine seam.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Arbitrary-precision integers backing the JS BigInt primitive.
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
unicode-normalization = "0.1.25"
# Intl: locale identifier parsing/canonicalization (`icu_locale_core`, already in
# the tree via oxc) plus the CLDR-data-backed canonicalizer/expander (`icu_locale`,
# `compiled_data`) that powers `Intl.getCanonicalLocales` and `Intl.Locale`.
icu_locale_core = "2"
icu_locale = "2"
# Intl.PluralRules: plural-category rules + decimal operand model
# (`ryu` enables building an operand decimal from an f64).
icu_plurals = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
# Intl.NumberFormat: locale-aware decimal formatting (grouping, digits).
icu_decimal = "2"
# Temporal: the TC39 Temporal proposal implemented in Rust (calendars, time
# zones, durations, and the spec arithmetic).
temporal_rs = "0.2.3"
# Optional, off by default (see the `mimalloc` feature above): faster global
# allocator for the benchmark/`run` binary.
mimalloc = { version = "0.1", optional = true, default-features = false }
# The `jit` feature's compiler backend (pure Rust, no C): cranelift-jit maps
# executable memory and finalizes code, cranelift-frontend provides the SSA
# builder, cranelift-native probes the host ISA. Versions move in lockstep.
cranelift-jit = { version = "0.135.1", optional = true }
cranelift-module = { version = "0.135.1", optional = true }
cranelift-frontend = { version = "0.135.1", optional = true }
cranelift-codegen = { version = "0.135.1", optional = true }
cranelift-native = { version = "0.135.1", optional = true }

# The ALTERNATIVE entry point: the same file-runner as `examples/run.rs`, but
# built as its own binary with the Cranelift kernel JIT compiled in and
# enabled (`--no-jit` runs the same build with the tier off, for A/B).
# `required-features` keeps every default build of the crate — and the
# forbid(unsafe_code) guarantee that comes with it — untouched: the binary
# only exists under `cargo build -p chidori-js --features jit`.
[[bin]]
name = "chidori-js-jit"
path = "src/bin/chidori_js_jit.rs"
required-features = ["jit"]

[dev-dependencies]
criterion = "0.8"

# Micro-benchmarks for the JS-execution hot paths (compile, interpreter loop,
# property access, calls, arrays, strings). Run with `cargo bench -p chidori-js`.
[[bench]]
name = "execution"
harness = false

# Heap-utilization benchmarks over the same workloads: realm footprint,
# bytecode footprint, per-run peak/churn/retained, and a repeat-run leak
# check. Run with `cargo bench -p chidori-js --bench memory`.
[[bench]]
name = "memory"
harness = false

# Resume cost: VM image vs journal replay across run lengths — the O(live
# state) vs O(history) claim in `src/image.rs`. Run with
# `cargo bench -p chidori-js --bench vm_image`.
[[bench]]
name = "vm_image"
harness = false

# Workspace-wide lint levels (see [workspace.lints] in the root Cargo.toml).
[lints]
workspace = true
